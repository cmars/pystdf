name: Python Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        # Install the exact CPython for this matrix leg and use it for the venv.
        python-version: ${{ matrix.python-version }}
        enable-pip: false
    - name: Install dependencies (locked)
      run: uv sync --frozen
    - name: Run tests
      run: uv run --frozen pytest tests/ -v
